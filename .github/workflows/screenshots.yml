name: "Update screenshots"

on:
  schedule:
    # Every Friday at 06:00 UTC
    - cron: "0 6 * * 5"
  workflow_dispatch:

concurrency:
  group: screenshots
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  screenshots:
    name: Regenerate screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKFLOW_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}

      - name: Regenerate screenshots
        run: ./bin/screenshots

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.WORKFLOW_PAT }}
          base: develop
          branch: update-screenshots
          delete-branch: true
          add-paths: docs
          committer: decidim-bot <decidim-bot@users.noreply.github.com>
          author: decidim-bot <decidim-bot@users.noreply.github.com>
          commit-message: "Update screenshots"
          title: "Update screenshots"
          body: |
            Screenshots regenerated automatically from
            https://nightly.decidim.org/en/ with
            [`shot-scraper`](https://shot-scraper.datasette.io/), using the
            definitions in `shots.yml`.

            This pull request is created and updated automatically. It is only
            opened (or refreshed) when the generated screenshots have changed.
