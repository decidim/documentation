name: Vale linting
on:
  pull_request:
    
jobs:
  prose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version-file: ".node-version"
      - name: Install dependencies
        run: npm install
      - name: Vale
        uses: errata-ai/vale-action@reviewdog
        with:
          version: 3.7.1
          files: docs/en
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
