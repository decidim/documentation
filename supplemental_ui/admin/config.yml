  # The site navigation lives in a single AsciiDoc file rather than a folder of
  # entries. The custom `adoc` format keeps the whole file in `body`; the
  # preview renders the nav tree like a normal page.
  - name: navigation
    label: Navigation
    icon: menu
    files:
      - name: nav
        label: Navigation menu
        file: docs/en/modules/ROOT/nav.adoc
        format: adoc
        fields:
          - name: body
            label: Navigation (nav.adoc)
            widget: adoc
