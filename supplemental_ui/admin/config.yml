backend:
  name: github
  repo: decidim/documentation
  branch: develop
  base_url: https://auth.deploy.decidim.org

publish_mode: editorial_workflow
site_url: https://docs.decidim.org

media_folder: docs/en/modules/ROOT/assets/images

# Each page collection stores a whole AsciiDoc file in `body` with no front
# matter, so there is no title field. `identifier_field: body` stops the CMS
# from warning about a missing inferred title; entries are labelled by
# filename via `summary`.
#
# The editable `slug` lets editors name a new page: the filename is the only
# place the name is stored, so it has to be typed. It is only editable while
# creating an entry, because renaming a saved page would break the links from
# other pages and the navigation. `create`/`delete` let editors add and remove
# pages; the Navigation collection below edits the matching nav.adoc.
collections:
  - name: root
    label: Home
    label_singular: Page
    folder: docs/en/modules/ROOT/pages
    extension: adoc
    format: adoc
    create: true
    delete: true
    identifier_field: body
    summary: "{{filename}}"
    slug:
      editable: [create]
      hint: Filename of the new page, without the .adoc extension
      pattern: ['^[a-z0-9][a-z0-9_-]*$', 'Use lowercase letters, numbers, hyphens or underscores']
    preview_path: "en/develop/{{filename}}.html"
    fields:
      - name: body
        label: AsciiDoc
        widget: adoc
        media_folder: /docs/en/modules/ROOT/assets/images
        public_folder: /docs/en/modules/ROOT/assets/images
  - name: admin
    label: Admin
    label_singular: Page
    folder: docs/en/modules/admin/pages
    extension: adoc
    format: adoc
    create: true
    delete: true
    identifier_field: body
    summary: "{{filename}}"
    slug:
      editable: [create]
      hint: Filename of the new page, without the .adoc extension
      pattern: ['^[a-z0-9][a-z0-9_-]*$', 'Use lowercase letters, numbers, hyphens or underscores']
    nested:
      depth: 100
      summary: "{{filename}}"
      subfolders: false
    preview_path: "en/develop/admin/{{dirname}}/{{filename}}.html"
    fields:
      - name: body
        label: AsciiDoc
        widget: adoc
        media_folder: /docs/en/modules/admin/assets/images
        public_folder: /docs/en/modules/admin/assets/images
