backend:
  name: github
  repo: decidim/documentation
  branch: develop

# Inert on non-local hosts; detected automatically when running the
# admin locally against the Decap proxy server.
local_backend: true

publish_mode: editorial_workflow
site_url: https://docs.decidim.org

media_folder: docs/en/modules/ROOT/assets/images

collections:
  - name: contribute
    label: Contribute
    label_singular: Page
    folder: docs/en/modules/contribute/pages
    extension: adoc
    format: adoc
    create: false
    delete: false
    summary: "{{filename}}"
    preview_path: "en/develop/contribute/{{filename}}.html"
    fields:
      - name: body
        label: AsciiDoc
        widget: text
