backend:
  name: github
  repo: decidim/documentation
  branch: develop

# Inert on non-local hosts; detected automatically when running the
# admin locally against the Decap proxy server.
local_backend: true

publish_mode: editorial_workflow
site_url: https://docs.decidim.org

media_folder: docs/en/modules/ROOT/assets/images

# Each collection stores a whole AsciiDoc file in `body` with no front
# matter, so there is no title field. `identifier_field: body` stops Decap
# from warning about a missing inferred title; entries are labelled by
# filename via `summary`.
collections:
  - name: root
    label: Home
    label_singular: Page
    folder: docs/en/modules/ROOT/pages
    extension: adoc
    format: adoc
    create: false
    delete: false
    identifier_field: body
    summary: "{{filename}}"
    preview_path: "en/develop/{{filename}}.html"
    fields:
      - name: body
        label: AsciiDoc
        widget: adoc
  - name: admin
    label: Admin
    label_singular: Page
    folder: docs/en/modules/admin/pages
    extension: adoc
    format: adoc
    create: false
    delete: false
    identifier_field: body
    summary: "{{filename}}"
    nested:
      depth: 100
      summary: "{{filename}}"
      subfolders: false
    preview_path: "en/develop/admin/{{dirname}}/{{filename}}.html"
    fields:
      - name: body
        label: AsciiDoc
        widget: adoc
  - name: contribute
    label: Contribute
    label_singular: Page
    folder: docs/en/modules/contribute/pages
