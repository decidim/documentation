<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Decidim Docs — Content Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/@asciidoctor/core@2.2.9/dist/browser/asciidoctor.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  </head>
  <body>
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
    <script src="https://unpkg.com/decap-cms@^3.16.0/dist/decap-cms.js"></script>
    <script>
      // Static servers (e.g. `serve`, Netlify) may serve /admin without a
      // trailing slash, so resolve the admin directory from the page URL
      // before loading the asset files relative to it.
      window.ADMIN_DIR = (() => {
        const path = window.location.pathname;
        if (path.endsWith('/')) return path;
        if (path.endsWith('index.html')) return path.slice(0, path.lastIndexOf('/') + 1);
        return `${path}/`;
      })();
      const css = document.createElement('link');
      css.rel = 'stylesheet';
      css.href = `${window.ADMIN_DIR}admin.css`;
      document.head.appendChild(css);
      const js = document.createElement('script');
      js.src = `${window.ADMIN_DIR}admin.js`;
      document.body.appendChild(js);
    </script>
  </body>
</html>
