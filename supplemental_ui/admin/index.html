<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Decidim Docs — Content Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/@asciidoctor/core@2.2.9/dist/browser/asciidoctor.js" integrity="sha384-a42d6f3b92ebb4233c62db668478336e723d8d8691786d178a5813848f2a4023c8098546cd63c09406c890a9dfc5f166" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js" integrity="sha384-244c933618cce91d44946a099ece14d8b9f8a1f3dcab34acca742498473f286cbadf7eaa01997bd2d0cbb9f6e495afb7" crossorigin="anonymous"></script>
  </head>
  <body>
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
    <script src="https://unpkg.com/@sveltia/cms@0.229.0/dist/sveltia-cms.js" integrity="sha384-ed4cd23332f2cfe38f400320894c8e847d110fad2099d41f82eeacedd69383cebc5a71257efc81b08507392d58585db6" crossorigin="anonymous"></script>
    <script>
      // Static servers (e.g. `serve`, Netlify) may serve /admin without a
      // trailing slash, so resolve the admin directory from the page URL
      // before loading the asset files relative to it.
      window.ADMIN_DIR = (() => {
        const path = window.location.pathname;
        if (path.endsWith('/')) return path;
        if (path.endsWith('index.html')) return path.slice(0, path.lastIndexOf('/') + 1);
        return `${path}/`;
      })();
      const css = document.createElement('link');
      css.rel = 'stylesheet';
      css.href = `${window.ADMIN_DIR}admin.css`;
      document.head.appendChild(css);
      const scripts = [
        'upload-block.js',
        'adoc-config.js',
        'adoc-transforms.js',
        'adoc-preview.js',
        'adoc-control.js',
        'admin.js',
      ];
      for (const file of scripts) {
        const js = document.createElement('script');
        js.src = `${window.ADMIN_DIR}${file}`;
        // Keep dynamic scripts ordered so each module's dependencies exist.
        js.async = false;
        document.body.appendChild(js);
      }
    </script>
  </body>
</html>
